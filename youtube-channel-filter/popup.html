<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Channel Filter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      width: 260px;
      background: #0f0f0f;
      color: #f1f1f1;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #ff4444;
    }
    .field { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
    }
    input[type=number] {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      color: #f1f1f1;
      outline: none;
    }
    input[type=number]:focus { border-color: #ff4444; }
    button {
      margin-top: 4px;
      width: 100%;
      padding: 9px;
      background: #ff4444;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #cc0000; }
    .field-check {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field-check label {
      margin: 0;
      font-size: 13px;
      color: #f1f1f1;
      cursor: pointer;
    }
    input[type=checkbox] { cursor: pointer; accent-color: #ff4444; width: 14px; height: 14px; }
    .saved {
      margin-top: 8px;
      font-size: 12px;
      color: #4caf50;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <h2>YouTube Channel Filter</h2>
  <div class="field">
    <label for="subThreshold">Min subscribers</label>
    <input type="number" id="subThreshold" min="0" step="1000">
  </div>
  <div class="field">
    <label for="viewThreshold">Min views per video</label>
    <input type="number" id="viewThreshold" min="0" step="1000">
  </div>
  <div class="field-check">
    <input type="checkbox" id="removeShorts">
    <label for="removeShorts">Remove Shorts</label>
  </div>
  <button id="save">Save</button>
  <div class="saved" id="saved-msg">Saved — reload YouTube to apply</div>
  <script src="popup.js"></script>
</body>
</html>
